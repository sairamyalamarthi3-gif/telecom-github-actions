name: Telecom Availability CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Display availability result
        run: |
          python -c "from availability import calculate_availability; print(f'Circuit availability: {calculate_availability(43200, 20):.3f}%')"

          - name: Build Docker image
          run: docker build -t telecom-availability:${{ github.sha }} -t telecom-availability:latest .

            - name: Run Docker container
             run: docker run --rm telecom-availability:${{ github.sha }}

          - name: List Docker images
            run: docker image ls telecom-availability
